# 可移植示例：先替换下面的工具安装路径。只合并该条目，勿覆盖已有配置。
# 若希望限定项目，可放入受信任项目的.codex/config.toml；用户级配置会对更多项目生效。
[mcp_servers.claude_session_link]
command = 'node.exe'
args = ['C:/Tools/claude-codex-session-link/cli.mjs', 'mcp']
tool_timeout_sec = 360
# 如需指定自定义profile或Claude原生exe，取消以下注释并填实际路径。
# [mcp_servers.claude_session_link.env]
# CLAUDE_CONFIG_DIR = 'C:/Users/YourName/.claude'
# CLAUDE_SESSION_LINK_BIN = 'C:/Users/YourName/.local/bin/claude.exe'
